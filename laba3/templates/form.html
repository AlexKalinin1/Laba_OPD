<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск частого слова</title>
</head>
<body>
    <h1>Поиск самого частого слова в файле</h1>

    <form action="" method="post" enctype="multipart/form-data">
        <label>Выберите текстовый файл:</label>
        <input type="file" name="file" accept=".txt" required>

        <br><br>

        <input type="submit" value="Найти слово">
    </form>
</body>
</html>
